name: Nightly App Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-app:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Get version
        id: version
        run: |
          PROPS="Directory.Build.props"
          VERSION=$(grep -oP '<Version>\K[^<]+' "$PROPS" 2>/dev/null || echo "0.0.0")
          HASH=$(git rev-parse --short HEAD)
          echo "version=${VERSION}+nightly.${HASH}" >> $GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.400'

      - name: Restore dependencies
        run: dotnet restore KaedePhi.Tool.App/KaedePhi.Tool.App.csproj --locked-mode

      - name: Build App (Debug / Nightly)
        run: |
          CSPROJ="KaedePhi.Tool.App/KaedePhi.Tool.App.csproj"
          output_dir="./artifacts/app"
          runtimes=("win-x64" "linux-x64")

          mkdir -p "$output_dir"

          for runtime in "${runtimes[@]}"; do
            echo "Building net10.0 / $runtime (Debug)..."
            dotnet publish "$CSPROJ" \
              -c Debug \
              -f net10.0 \
              -r "$runtime" \
              --self-contained false \
              -o "$output_dir/net10.0-$runtime"

            cd "$output_dir/net10.0-$runtime"
            zip -r "../KaedePhi.Tool.App-nightly-net10.0-$runtime.zip" .
            cd -
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: app-nightly-build-${{ github.sha }}
          path: ./artifacts/app/*.zip
          if-no-files-found: warn
          retention-days: 1

  build-installer:
    needs: build-app
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: app-nightly-build-${{ github.sha }}
          path: ./artifacts/app

      - name: Extract Windows build
        shell: pwsh
        run: |
          $version = "${{ needs.build-app.outputs.version }}"
          $fullVersion = "$version+${{ github.sha }}"
          $zipFile = "./artifacts/app/KaedePhi.Tool.App-nightly-net10.0-win-x64.zip"
          $publishDir = "./publish"
          
          Expand-Archive -Path $zipFile -DestinationPath $publishDir
          
          echo "KAEPHI_VERSION=$fullVersion" >> $env:GITHUB_ENV
          echo "KAEPHI_PROJECT_DIR=$env:GITHUB_WORKSPACE" >> $env:GITHUB_ENV
          echo "KAEPHI_PUBLISH_DIR=$env:GITHUB_WORKSPACE\$publishDir" >> $env:GITHUB_ENV

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $isccPath)) {
            throw "Inno Setup is not installed on the runner."
          }
          & $isccPath SetupGenScript.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: app-nightly-installer-${{ github.sha }}
          path: ./setup/*.exe
          if-no-files-found: warn
          retention-days: 7

  upload-nightly:
    needs: [build-app, build-installer]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: ./artifacts

      - name: Upload nightly artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: app-nightly-${{ github.sha }}
          path: |
            ./artifacts/app-nightly-build-*/*.zip
            ./artifacts/app-nightly-installer-*/*.exe
          if-no-files-found: warn
          retention-days: 7

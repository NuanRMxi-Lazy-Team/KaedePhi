name: Release Core

concurrency:
  group: release-core-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - 'Directory.Build.props'
  workflow_dispatch:
    inputs:
      test_build:
        description: '仅测试构建（不发版）'
        required: false
        default: false
        type: boolean
      create_release:
        description: '创建 Release 发版'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  test-core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: '10.0.302'

      - name: Restore dependencies
        run: dotnet restore KaedePhi.sln --locked-mode

      - name: Run tests
        run: dotnet test KaedePhi.Tests/KaedePhi.Tests.csproj --configuration Release --no-restore --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Upload coverage
        uses: actions/upload-artifact@v4.3.0
        with:
          name: core-test-results
          path: TestResults
          if-no-files-found: error
          retention-days: 7

  build-core:
    needs: test-core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: '10.0.302'

      - name: Build and pack Core
        run: |
          dotnet restore KaedePhi.Core/KaedePhi.Core.csproj --locked-mode
          CSPROJ="KaedePhi.Core/KaedePhi.Core.csproj"
          mkdir -p ./artifacts
          dotnet build "$CSPROJ" -c Release
          dotnet pack "$CSPROJ" -c Release --no-build -o ./artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4.3.0
        with:
          name: core-artifacts
          path: ./artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 7

  release-core:
    needs: [test-core, build-core]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_release == true && inputs.test_build == false)
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4.3.0
        with:
          name: core-artifacts
          path: ./artifacts

      - name: Create Core release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CSPROJ="KaedePhi.Core/KaedePhi.Core.csproj"
          PROPS="Directory.Build.props"

          get_version() {
            grep -oP '<Version>\K[^<]+' "$1" 2>/dev/null || echo ""
          }

          is_prerelease() {
            local patch=$(echo "$1" | cut -d'.' -f3)
            local build=$(echo "$1" | cut -d'.' -f4)
            if [ "$patch" != "0" ] || [ ! -z "$build" -a "$build" != "0" ]; then echo "true"; else echo "false"; fi
          }

          VERSION=$(get_version "$CSPROJ")
          if [ -z "$VERSION" ]; then
            VERSION=$(get_version "$PROPS")
          fi
          if [ -z "$VERSION" ]; then echo "Could not extract version from $CSPROJ or $PROPS, skipping."; exit 0; fi

          TAG="Core-v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping..."
            exit 0
          fi

          PRERELEASE=$(is_prerelease "$VERSION")
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

          RELEASE_ARGS=("$TAG" --title "Core v${VERSION}" --notes "自动发布 Core 版本 $VERSION")
          [ "$PRERELEASE" = "true" ] && RELEASE_ARGS+=(--prerelease) || RELEASE_ARGS+=(--no-latest)
          RELEASE_ARGS+=(./artifacts/*.nupkg)

          gh release create "${RELEASE_ARGS[@]}"
          echo "Created release: Core v${VERSION} (prerelease: $PRERELEASE)"

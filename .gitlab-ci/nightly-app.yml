# nightly-app 分为两个独立 job：
#   1. nightly-app-build      - linux docker，构建 App zip 产物
#   2. nightly-app-installer  - windows runner，构建安装包

nightly-app-build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:10.0.302
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  before_script:
    - apt-get update -qq && apt-get install -y -qq zip
  script:
    - |
      PROPS="Directory.Build.props"
      CSPROJ="KaedePhi.Tool.App/KaedePhi.Tool.App.csproj"
      output_dir="./artifacts/app"
      runtimes=("win-x64" "linux-x64")

       VERSION=$(grep -oP '<Version>\K[^<]+' "$PROPS" 2>/dev/null || echo "0.0.0")
      HASH=$(git rev-parse --short HEAD)
      FULL_VERSION="${VERSION}+nightly.${HASH}"
      echo "$FULL_VERSION" > nightly-version.txt

       mkdir -p "$output_dir"

       dotnet restore "$CSPROJ" --locked-mode

       for runtime in "${runtimes[@]}"; do
        echo "Building net10.0 / $runtime (Debug)..."
        dotnet publish "$CSPROJ" \
          -c Debug \
          -f net10.0 \
          -r "$runtime" \
          --self-contained false \
          -o "$output_dir/net10.0-$runtime"

        cd "$output_dir/net10.0-$runtime"
        zip -r "../KaedePhi.Tool.App-nightly-net10.0-$runtime.zip" .
        cd -
      done
  artifacts:
    paths:
      - artifacts/app/*.zip
      - nightly-version.txt
    expire_in: 7 days

nightly-app-installer:
  stage: installer
  tags: [windows]
  needs:
    - job: nightly-app-build
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  script:
    - |
      $ErrorActionPreference = "Stop"

      $version = (Get-Content -Path "nightly-version.txt" -Raw).Trim()
      $zipFile = "./artifacts/app/KaedePhi.Tool.App-nightly-net10.0-win-x64.zip"
      $publishDir = (Resolve-Path ".").Path + "\publish"

      Expand-Archive -Path $zipFile -DestinationPath $publishDir -Force

      $env:KAEPHI_VERSION = $version
      $env:KAEPHI_PROJECT_DIR = (Resolve-Path ".").Path
      $env:KAEPHI_PUBLISH_DIR = $publishDir

       $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
       if (-not (Test-Path $isccPath)) {
         throw "Inno Setup is not installed on the runner."
       }
      & $isccPath SetupGenScript.iss
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  artifacts:
    paths:
      - setup/*.exe
    expire_in: 7 days
